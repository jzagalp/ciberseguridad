<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberPath — Tu manager de aprendizaje en ciberseguridad</title>
  <meta name="description" content="Programa que te enseña ciberseguridad desde cero: organiza tu ruta, te dice qué hacer cada día y monitoriza tu progreso." />
